schema_version = 1
id = "klipp-video"
name = "Klipp video"
description = "Spør om start og slutt (f.eks. 0:10 og 1:25) og lager et klipp ved siden av originalen."
icon = "video-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["mp4", "avi", "flv", "3gp"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
