schema_version = 1
id = "fjern-bakgrunn"
name = "Fjern bakgrunn"
description = "Lag en PNG med gjennomsiktig bakgrunn ved siden av originalen. Kjører lokalt med rembg."
icon = "image-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["jpg", "jpeg", "png", "webp", "pdf"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
