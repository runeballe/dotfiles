schema_version = 1
id = "konverter-til-webp"
name = "Konverter til WebP"
description = "Lag en WebP-kopi ved siden av originalen. Originalen beholdes."
icon = "image-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["jpg", "jpeg", "png", "pdf"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
