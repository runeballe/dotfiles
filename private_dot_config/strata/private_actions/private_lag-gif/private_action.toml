schema_version = 1
id = "lag-gif"
name = "Lag GIF"
description = "Velg hastighet (x0,5, x1, x2 eller x3) og lag en GIF, 15 bilder/s og maks 480 px bred."
icon = "video-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["mp4", "avi", "flv", "3gp"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
