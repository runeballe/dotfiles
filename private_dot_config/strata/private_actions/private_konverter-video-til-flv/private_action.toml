schema_version = 1
id = "konverter-video-til-flv"
name = "Konverter til FLV"
description = "Lag en FLV-kopi ved siden av originalen. Originalen beholdes."
icon = "video-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["mp4", "avi", "3gp"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
