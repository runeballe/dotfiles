schema_version = 1
id = "endre-hastighet"
name = "Endre hastighet"
description = "Velg x0,5, x1, x2 eller x3 og lag en kopi med ny hastighet. Lyden følger med."
icon = "video-x-generic"
enabled = true
menu = "top"

[when]
kinds = ["file"]
extensions = ["mp4", "avi", "flv", "3gp"]
min_items = 1

[run]
runtime = "bash"
entrypoint = "run.sh"
mode = "per-item"
on_error = "continue"
working_directory = "parent"
confirm = false
